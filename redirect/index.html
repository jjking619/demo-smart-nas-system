<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f1923 0%, #1a2a3a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    }
    .card {
      text-align: center; color: #e0e8f0; padding: 48px 40px; max-width: 520px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h2 { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
    p  { font-size: 14px; color: #8ba0b4; margin-bottom: 26px; line-height: 1.7; }
    .btn {
      display: block; width: 100%; padding: 14px 0;
      background: linear-gradient(135deg, #4a9eff, #2563eb);
      color: #fff; border-radius: 12px;
      text-decoration: none; font-size: 16px; font-weight: 600;
    }
    .url { margin-top: 18px; font-size: 12px; color: #6b7e90; word-break: break-all; }
    .tip { margin-top: 10px; font-size: 12px; color: #8ba0b4; line-height: 1.8; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">&#x1F9BE;</div>
  <h2>&#x6B63;&#x5728;&#x8DF3;&#x8F6C;&#x5230; OpenClaw&#x2026;</h2>
  <p>&#x82E5;&#x672A;&#x81EA;&#x52A8;&#x8DF3;&#x8F6C;&#xFF0C;&#x8BF7;&#x70B9;&#x51FB;&#x4E0B;&#x65B9;&#x6309;&#x9215;</p>
  <a id="btn" class="btn" href="#" target="_top">&#x8FDB;&#x5165; OpenClaw &#x754C;&#x9762;</a>
  <a id="btnHttps" class="btn" href="#" target="_top" style="margin-top:10px;background:linear-gradient(135deg,#64748b,#334155);">HTTPS &#x5907;&#x9009;&#x5165;&#x53E3;</a>
  <div class="url" id="url"></div>
  <div class="tip">&#x9996;&#x6B21;&#x8BBF;&#x95EE;&#x4F1A;&#x63D0;&#x793A;&#x8BC1;&#x4E66;&#x4E0D;&#x53D7;&#x4FE1;&#x4EFB;<br>&#x8BF7;&#x70B9;&#x51FB;&#x201C;&#x9AD8;&#x7EA7; &rarr; &#x7EE7;&#x7EED;&#x524D;&#x5F80;&#x201D;&#x653E;&#x884C;&#x4E00;&#x6B21;&#x5373;&#x53EF;</div>
</div>
<script>
  var qs = new URLSearchParams(location.search);
  var defaultToken = '__OPENCLAW_TOKEN__';
  var unresolvedMarker = '__OPENCLAW' + '_TOKEN__';
  if (defaultToken === unresolvedMarker) defaultToken = 'casaos';
  var token = qs.get('token') || defaultToken;
  var httpsBase = 'https://' + location.hostname + ':24190/';
  var url = httpsBase + '#token=' + encodeURIComponent(token);
  var httpsUrl = httpsBase;
  var btn = document.getElementById('btn');
  var btnHttps = document.getElementById('btnHttps');
  btn.href = url;
  btnHttps.href = httpsUrl;
  document.getElementById('url').textContent = url;
  setTimeout(function () {
    try { window.top.location.href = url; } catch (e) {}
  }, 300);
</script>
</body>
</html>
