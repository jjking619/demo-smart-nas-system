name: nas-filebrowser
services:
  filebrowser:
    image: filebrowser/filebrowser:2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    container_name: filebrowser
    user: "__NAS_PUID__:__NAS_PGID__"
    restart: unless-stopped
    volumes:
      - type: bind
        source: __NAS_ROOT__
        target: /srv
      - type: bind
        source: /DATA/AppData/filebrowser/config
        target: /config
      - type: bind
        source: /DATA/AppData/filebrowser/database
        target: /database
    ports:
      - mode: ingress
        target: 80
        published: "28085"
        protocol: tcp
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    x-casaos:
      ports:
        - container: "80"
          description:
            en_US: "NAS file browser web UI"
      volumes:
        - container: /srv
          description:
            en_US: "nas_share (read-write)"
        - container: /config
          description:
            en_US: "FileBrowser config"
        - container: /database
          description:
            en_US: "FileBrowser database"

x-casaos:
  architectures:
    - amd64
    - arm64
  author: local
  category: Utilities
  description:
    en_US: Web file browser for __NAS_ROOT__.
  developer: filebrowser
  icon: "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='20' fill='%230f172a'/%3E%3Cpath d='M22 32c0-3.3 2.7-6 6-6h16l7 8h29c3.3 0 6 2.7 6 6v26c0 3.3-2.7 6-6 6H28c-3.3 0-6-2.7-6-6V32z' fill='%23f59e0b'/%3E%3Cpath d='M22 40c0-2.2 1.8-4 4-4h44c2.2 0 4 1.8 4 4v24c0 2.2-1.8 4-4 4H26c-2.2 0-4-1.8-4-4V40z' fill='%2338bdf8'/%3E%3C/svg%3E"
  id: org.local.nas.filebrowser
  is_uncontrolled: false
  main: filebrowser
  port_map: "28085"
  store_app_id: nas-filebrowser
  tagline:
    en_US: Browse nas_share
  thumbnail: ""
  title:
    en_US: NAS Files